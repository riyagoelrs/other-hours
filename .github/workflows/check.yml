name: Check static site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate JavaScript and static assets
        run: |
          node --check app.js
          node --check data.js
          node scripts/validate.mjs
          test -s index.html
          test -s styles.css
          test -s assets/favicon.svg
